name: deploy

# hanzo.industries is a SITE, not an App: a static export with no compute. It ships on the
# Sites plane. Not GitHub Pages, not Cloudflare Pages, and not an image — baking
# files that never execute into a container so a Go binary can serve them means an
# image, a push, a tag pinned in a CR and running pods, all to hand back bytes.
#
#   build -> out
#     -> site
#
# The publish mechanics are NOT here. They are bin/site in hanzoai/ci, reached
# through its action, and every static surface in the fleet calls that one
# script — ensure-project, enqueue, presigned per-file upload, complete. A
# contract transcribed per repo is a contract that drifts, and this file used to
# carry its own copy of every call. It also SELF-PROVISIONS: the project is
# created idempotently before the enqueue, so committing this file is enough to
# stand the site up.
#
# The secrets are the KMS machine identity (hanzoai org secrets), and the action
# reads the deploy key from KMS with them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # The cluster's ephemeral runners register with the single label
    # `linux-amd64`. An unmatched label is not an error, it is silence: the job
    # queues until the 24h timeout and nothing says so.
    runs-on: [linux-amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: build the static export
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          corepack enable && corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build
          test -s out/index.html || { echo "::error::next build produced no out/index.html"; exit 1; }
          echo "exported $(find out -type f | wc -l) files"

      # This gate has caught real breakage, so it runs against the SAME out/ that
      # gets synced. No `cp out/index.html out/404.html`: every route here is a
      # real exported file, so clobbering the 404 would make a broken link answer
      # 404 while rendering the front page.
      - name: smoke test the export
        run: |
          set -euo pipefail
          pnpm dlx serve out -l 3333 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3333 && { echo "server ready after ${i}s"; break; }
            sleep 1
          done
          BODY=$(curl -s http://localhost:3333)
          kill $SERVER_PID 2>/dev/null || true
          echo "$BODY" | grep -q "Application error" && { echo "::error::homepage renders 'Application error'"; exit 1; }
          FAILED=0
          for page in index about research contact careers news ai-models; do
            [ -f "out/${page}.html" ] || [ -f "out/${page}/index.html" ] || { echo "::error::missing page ${page}"; FAILED=1; }
          done
          [ "$FAILED" = "0" ]
          echo "all smoke tests passed"

      # The publishable key is declared in components/Analytics.tsx; it admits
      # every anonymous event and names the site's tag set. A key the endpoint
      # refuses (401/403) stops the publish; an outage does not.
      - name: Prove the keys the bundle carries resolve at the endpoint
        run: |
          set -euo pipefail
          keys=$(grep -rhoE 'pk-[A-Za-z0-9_-]{20,}' out/_next/static | sort -u)
          [ -n "$keys" ] || { echo "::error::no pk- publishable key in out/_next/static; every anonymous event would 401"; exit 1; }
          refused=0
          for key in $keys; do
            for wait in 0 10 30; do
              [ "$wait" = 0 ] || sleep "$wait"
              code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST \
                "https://api.hanzo.ai/v1/event?ingest_key=$key" \
                -H 'content-type: application/json' -d '{"batch":[]}' || true)
              case "$code" in 200|401|403) break ;; esac
            done
            case "$code" in
              200) echo "resolves: $key" ;;
              401|403) echo "::error::$key answered $code"; refused=1 ;;
              *) echo "::warning::api.hanzo.ai answered $code for $key; unverified, not refused" ;;
            esac
          done
          [ "$refused" = 0 ]

      # Sign-in is hanzo.ai's: no page may send a browser to the identity host.
      - name: Prove no page navigates to hanzo.id
        run: |
          set -euo pipefail
          if grep -rlE 'href="https://hanzo\.id|location[^;]{0,40}hanzo\.id|/v1/iam/oauth/authorize' out; then
            echo "::error::a page links or redirects to hanzo.id"; exit 1
          fi

      # ONE credential, and the action reads it from KMS: the machine identity is
      # what travels, and the deploy key is resealed in one place rather than
      # copied into every org's secret store. The 202 carries a prefix-scoped,
      # 30-minute presigned POST grant, so nothing here holds a bucket key. Do NOT
      # add SITES_S3_* — that is the standing shared-bucket credential the grant
      # replaced, and it could overwrite every other org's site.
      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/site@v1
        with:
          slug: hanzo-industries
          dir: out
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
